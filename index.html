<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0d1833" />
    <title>Barai Udda</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section
        id="characterScreen"
        class="screen selection-screen"
        aria-labelledby="selectionTitle"
      >
        <h1 id="selectionTitle"><span>Panchi Barai </span></h1>
        <p class="intro">Pick Barai to Fly.</p>

        <div
          id="characters"
          class="character-grid"
          aria-label="Choose a character"
        ></div>

        <button id="startBtn" class="primary-button" type="button">
          <span>Start flying</span>
          <span aria-hidden="true">→</span>
        </button>
      </section>

      <section
        id="gameScreen"
        class="screen game-screen"
        hidden
        aria-label="Friend Flappy game"
      >
        <div class="game-header">
          <button
            id="backBtn"
            class="icon-button"
            type="button"
            aria-label="Back to character selection"
          >
            ←
          </button>

          <div class="score-pill" aria-live="polite">
            Score <strong id="scoreValue">0</strong>
          </div>
        </div>

        <div class="game-wrap">
          <canvas
            id="gameCanvas"
            aria-label="Flappy game. Tap, click, or press Space to fly."
          ></canvas>
          <div id="gameOverlay" class="game-overlay" hidden>
            <div class="overlay-card">
              <p class="eyebrow">Flight complete</p>
              <h2 id="overlayTitle">Nice try!</h2>
              <div class="result-stats">
                <div><span>Score</span><strong id="finalScore">0</strong></div>
                <div><span>Best</span><strong id="bestScore">0</strong></div>
              </div>
              <button id="restartBtn" class="primary-button" type="button">
                <span>Fly again</span>
                <span aria-hidden="true">↻</span>
              </button>
              <button id="changeFriendBtn" class="text-button" type="button">
                Choose another friend
              </button>
            </div>
          </div>
          <div class="touch-hint" aria-hidden="true">Tap to flap</div>
        </div>
        <p class="control-hint">
          <kbd>SPACE</kbd> or <kbd>↑</kbd> to flap <span>•</span> Tap anywhere
          on the game
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
